brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# The sample app runs on the host, so advertise the broker on the host-mapped address.
# For clients on other machines, replace 127.0.0.1 with the host's reachable IP.
brokerIP1 = 127.0.0.1

# Let the sample publish to a topic that does not exist yet.
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
